name: Build and Test with Dagger
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - main

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        id: build-and-test
        uses: dagger/dagger-for-github@8.0.0
        with:
          version: "0.16.3"
          verb: call
          args: build-and-test
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}